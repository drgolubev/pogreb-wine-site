<svg class="xs" viewBox="0 0 640 640" role="img" aria-labelledby="xs-t xs-d">
<title id="xs-t">Разрез спирального винного погреба</title>
<desc id="xs-d">Погреб под полом: стеклянный люк, винтовая лестница, стены из модульных бетонных блоков, мембрана ЭПДМ, кессон, естественная вентиляция с выводом на фасад. Температура от +18 °C наверху до +10 °C внизу, глубина от 2 до 3 метров.</desc>
