name: Сборка и публикация сайта
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки для фото
        run: pip install pillow pillow-heif
      - name: Собрать сайт
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  hosting:
    # Заливка на хостинг pogreb-wine.ru по FTP. Включается сама, когда в Settings → Secrets → Actions
    # заданы FTP_SERVER, FTP_USER, FTP_PASSWORD и FTP_DIR (папка сайта на хостинге, со слэшем на конце).
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''
      - uses: actions/setup-python@v5
        if: env.FTP_SERVER != ''
        with:
          python-version: '3.12'
      - name: Собрать сайт
        if: env.FTP_SERVER != ''
        run: pip install pillow pillow-heif && python build.py
      - name: Залить на хостинг
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
      - name: Хостинг ещё не подключён
        if: env.FTP_SERVER == ''
        run: echo "FTP_SERVER не задан, заливка на хостинг пропущена"
