name: Сбор контактов бюро
on:
  push:
    branches: [collector]
    paths: ['collector/input.json']
permissions:
  contents: write
concurrency:
  group: collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Собрать
        run: python collector/collect.py
      - name: Зашифровать и сохранить
        run: |
          mkdir -p out
          KEY=$(openssl rand -hex 32)
          openssl enc -aes-256-cbc -pbkdf2 -salt -in out.json -out out/result.enc -pass pass:$KEY
          printf '%s' "$KEY" | openssl pkeyutl -encrypt -pubin -inkey collector/pub.pem -out out/key.enc
          rm out.json
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add out
          git commit -m "Результат сбора [skip ci]"
          git push
